name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make check
      # make fmt rewrites files; unformatted code shows up as a diff.
      - run: git diff --exit-code

  integration:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make test-integration

  e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Playwright uses the runner's preinstalled Google Chrome (channel: chrome).
      - run: make e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: |
            web/test-results/
            web/e2e/.tmp/server.log
          retention-days: 7

  # Each architecture is built and run natively, so no emulation is needed.
  image:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    # A stable name: branch protection requires these checks by name.
    name: image-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make image-multiarch PLATFORMS="linux/$ARCH"
        env:
          ARCH: ${{ matrix.arch }}

  # A v* tag on main publishes one multi-arch image, with an SBOM and a signed
  # provenance attestation, after every check passes. The Go and Node stages
  # run on the build platform, so the arm64 half needs no QEMU.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, integration, e2e, image]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: release # tag rule v*, optional required reviewer
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write # push the image to ghcr.io
      id-token: write # Sigstore certificate for the attestation
      attestations: write # store the attestation
      artifact-metadata: write # storage record for the pushed image
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and origin/main for the checks below
          persist-credentials: false
      - name: Require a release tag on main
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::release tags must be vX.Y.Z or vX.Y.Z-pre"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::the tagged commit is not on main"; exit 1; }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Dependabot does not see this pin: bump it by hand.
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        run: |
          image="ghcr.io/$GITHUB_REPOSITORY"
          tags=(-t "$image:${GITHUB_REF_NAME#v}")
          # latest only for the highest final release on main: not a pre-release, a backport or a re-run of an old tag.
          newest=$(git tag -l 'v*' --merged origin/main --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          if [ "$GITHUB_REF_NAME" = "$newest" ]; then tags+=(-t "$image:latest"); fi
          # Dependabot does not track the SBOM scanner pin below: bump it by hand.
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$GITHUB_REF_NAME" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.version="${GITHUB_REF_NAME#v}" \
            --label org.opencontainers.image.licenses=Apache-2.0 \
            --sbom=generator=docker/buildkit-syft-scanner:stable-1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315 \
            --metadata-file "$RUNNER_TEMP/build.json" \
            "${tags[@]}" -f deploy/Dockerfile --push .
          echo "digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/build.json")" >>"$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Runs the image check on the pushed image itself, pulled by digest without a
  # login, as a user would.
  verify:
    needs: publish
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    name: verify-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          docker pull --platform "linux/$ARCH" "$IMAGE"
          deploy/image-check.sh "$IMAGE" "linux/$ARCH" "$GITHUB_REF_NAME"
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.digest }}
          ARCH: ${{ matrix.arch }}
