version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    groups:
      go: {patterns: ["*"]}
  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    groups:
      npm-prod: {dependency-type: production}
      npm-dev: {dependency-type: development}
    ignore:
      # typescript-eslint pins typescript below 6.1; lift this when it allows more.
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
  - package-ecosystem: docker
    directories: [/deploy, /deploy/openldap]
    schedule: {interval: weekly}
  - package-ecosystem: docker-compose
    directories: [/deploy, /deploy/e2e]
    schedule: {interval: weekly}
    # One PR for both files. The integration tests build the same
    # deploy/openldap Dockerfile, so nothing else pins an OpenLDAP image.
    groups:
      compose: {patterns: ["*"]}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
