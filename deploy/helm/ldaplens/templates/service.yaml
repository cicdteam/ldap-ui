apiVersion: v1
kind: Service
metadata:
  name: {{ include "ldaplens.fullname" . }}
  labels:
    {{- include "ldaplens.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    {{- include "ldaplens.selectorLabels" . | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
