{{- if .Values.networkPolicy.enabled -}}
{{- if not .Values.networkPolicy.from -}}
{{- fail "networkPolicy.from is empty, which would let every source in: list the ingress controller's pods as peers, or set networkPolicy.enabled to false" -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ldaplens.fullname" . }}
  labels:
    {{- include "ldaplens.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ldaplens.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.from | nindent 8 }}
      ports:
        - {protocol: TCP, port: http}
{{- end }}
