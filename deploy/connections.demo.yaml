connections:
  - name: demo
    url: ldap://openldap:1389
    baseDN: dc=example,dc=org
    bindDN: cn=admin,dc=example,dc=org
    passwordEnv: DEMO_LDAP_PASSWORD
  # The same directory, read-only: the header shows the READ-ONLY badge and
  # no editing is offered.
  - name: demo-readonly
    url: ldap://openldap:1389
    baseDN: dc=example,dc=org
    bindDN: cn=admin,dc=example,dc=org
    passwordEnv: DEMO_LDAP_PASSWORD
    readOnly: true
  # Samba AD (LDAPS, test CA). Bind as Administrator; demo people use
  # Demo-Passw0rd!.
  - name: demo-ad
    url: ldaps://samba:636
    baseDN: DC=corp,DC=example,DC=test
    bindDN: CN=Administrator,CN=Users,DC=corp,DC=example,DC=test
    passwordEnv: AD_LDAP_PASSWORD
    caFile: /etc/ldaplens/ad-ca.pem
