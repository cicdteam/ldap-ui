# See the Dockerfile. Anything not set here is a slapd default: no indexes,
# no access lines (anyone reads, only the rootdn writes), no TLS.
include /etc/ldap/schema/core.schema
include /etc/ldap/schema/cosine.schema
include /etc/ldap/schema/inetorgperson.schema
include /etc/ldap/schema/nis.schema

modulepath /usr/lib/ldap
moduleload back_mdb

database mdb
suffix dc=example,dc=org
rootdn cn=admin,dc=example,dc=org
rootpw adminpassword
directory /var/lib/ldap
# The mdb default of 10 MB is too small for the integration tests' seed.
maxsize 1073741824
